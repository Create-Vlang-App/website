name: Pull Request Validation

concurrency:
  group: pull_request_${{ github.event.number }}
  cancel-in-progress: true

on:
  # Run this workflow on pull request to main
  pull_request:
    branches:
      - main

permissions:
  actions: write
  checks: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  pr-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install Danger dependencies
        working-directory: tools/danger
        run: npm ci

      - name: Run Danger
        run: tools/danger/node_modules/.bin/danger ci --dangerfile tools/danger/dangerfile.ts --failOnErrors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DANGER_GITHUB_API_TOKEN: ${{ secrets.DANGER_GITHUB_API_TOKEN }}
